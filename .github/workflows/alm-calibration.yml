name: LEVEL MATCH engine calibration
on:
  push:
    branches: [chatgpt/1.8-level-match]
    paths: ['tests/alm*', 'Source/MasterSpace/ALMCalibration.h', '.github/workflows/alm-calibration.yml']
  pull_request:
    branches: [claude/1.8-studio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev ninja-build xvfb
      - name: Configure and build offline engine survey (no plugins)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAS_BUILD_TESTS=ON -DCMAKE_PROJECT_MasAudio_INCLUDE="$PWD/tests/alm-survey.cmake"
          cmake --build build --target MasterSpace18Tests -j 2
      - name: Measure 48 and 96 kHz
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a ./build/MasterSpace18Tests_artefacts/Release/MasterSpace18Tests | tee alm-calibration.log
          test "$(grep -c '^ALM ' alm-calibration.log)" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alm-calibration-report
          path: alm-calibration.log
          if-no-files-found: warn
