name: Build macOS (AU + VST3)

on:
  push:
    branches: [ main, dev-1.2, feature/atmospheric-tail ]
  workflow_dispatch:

jobs:
  dsp-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Offline MASTER SPACE engine test (depth, locks, materials, automation, stability)
        run: |
          pip install --quiet numpy scipy
          g++ -O2 -std=c++17 -o tests/render_space tests/render_space.cpp
          python3 tests/analyze_space.py | tee space.log
          ! grep -q "nan True" space.log
          python3 tests/metal.py --check
      - name: ATMOSPHERIC TAIL (RT60 1-30 s, ringing, modes, stereo, Decay automation, CPU)
        run: |
          g++ -O2 -std=c++17 -DMAS_ATMOS -o tests/render_atmos tests/render_space.cpp
          MS_ATMOS_RENDER=tests/render_atmos python3 tests/atmos_measure.py --check | tee atmos.log
      - name: Engine stress test (random automation of every parameter, 1.2 and 1.1 Legacy)
        run: |
          g++ -O2 -std=c++17 -o stress tests/stress_engines.cpp
          ./stress -1 40

  plugin-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev \
                                      libfreetype6-dev libfontconfig1-dev ninja-build
      - name: Build headless processor tests
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAS_BUILD_TESTS=ON
          cmake --build build --target MasterSpaceTests MasterSpaceAtmosTests
      - name: Presets, A/B, state restore (48/96 kHz), transitions, migration, automation, CPU
        run: |
          ./build/MasterSpaceTests_artefacts/Release/MasterSpaceTests | tee plugin-tests.log
          ./build/MasterSpaceAtmosTests_artefacts/Release/MasterSpaceAtmosTests | tee -a plugin-tests.log
      - uses: actions/upload-artifact@v4
        with:
          name: MASTER-SPACE-plugin-tests
          path: plugin-tests.log

  build:
    name: build (${{ matrix.name }})
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: MasterSpace
            name: MASTER SPACE
            code: MSpc
            slug: MASTER-SPACE
          - target: MasterSpace11
            name: MASTER SPACE 1.1
            code: MSp1
            slug: MASTER-SPACE-1.1-AB
          - target: MasterSpaceAtmos
            name: MASTER SPACE ATMOS
            code: MSpA
            slug: MASTER-SPACE-ATMOS-1.3.0-experimental
    env:
      TARGET: ${{ matrix.target }}
      NAME: ${{ matrix.name }}
      CODE: ${{ matrix.code }}
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --target "${TARGET}_AU" "${TARGET}_VST3" -- -quiet

      - name: Ad-hoc sign
        run: |
          ART="build/${TARGET}_artefacts/Release"
          codesign --force --deep --sign - "$ART/AU/$NAME.component"
          codesign --force --deep --sign - "$ART/VST3/$NAME.vst3"
          lipo -info "$ART/AU/$NAME.component/Contents/MacOS/$NAME"

      - name: Validate Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/${TARGET}_artefacts/Release/AU/$NAME.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i "Mast" || true
          auval -strict -v aufx "$CODE" Mast | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log

      - name: pluginval (state save / restore, automation, 44.1 / 48 / 96 kHz)
        if: matrix.target == 'MasterSpace' || matrix.target == 'MasterSpaceAtmos'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          mkdir -p ~/Library/Audio/Plug-Ins/VST3
          cp -R "build/${TARGET}_artefacts/Release/VST3/$NAME.vst3" ~/Library/Audio/Plug-Ins/VST3/
          $PV --strictness-level 7 --sample-rates 44100,48000,96000 --block-sizes 64,256,512,1024 \
              --validate ~/Library/Audio/Plug-Ins/VST3/"$NAME.vst3" 2>&1 | tee pluginval-vst3.log
          $PV --strictness-level 7 --sample-rates 44100,48000,96000 --block-sizes 64,256,512,1024 \
              --validate ~/Library/Audio/Plug-Ins/Components/"$NAME.component" 2>&1 | tee pluginval-au.log

      - name: Package
        run: |
          ART="build/${TARGET}_artefacts/Release"
          OUT="dist/$NAME"
          mkdir -p "$OUT"
          cp -R "$ART/AU/$NAME.component" "$OUT/"
          cp -R "$ART/VST3/$NAME.vst3" "$OUT/"
          sed "s/__NAME__/$NAME/g" installer/install.command.in > "$OUT/Install $NAME.command"
          README_IN="installer/README-${TARGET}.txt.in"
          [ -f "$README_IN" ] || README_IN="installer/README.txt.in"
          sed "s/__NAME__/$NAME/g" "$README_IN" > "$OUT/README.txt"
          chmod +x "$OUT/Install $NAME.command"
          cp auval.log "$OUT/auval-report.txt"
          [ -f pluginval-vst3.log ] && cp pluginval-vst3.log "$OUT/pluginval-vst3-report.txt"
          [ -f pluginval-au.log ] && cp pluginval-au.log "$OUT/pluginval-au-report.txt"
          [ -d presets/factory ] && [ "$TARGET" = "MasterSpace" ] && mkdir -p "$OUT/Preset format" && cp docs/PRESET_FORMAT.md "$OUT/Preset format/" 2>/dev/null || true
          cd dist && ditto -c -k --keepParent "$NAME" "$SLUG-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-macOS
          path: dist/${{ matrix.slug }}-macOS.zip
          retention-days: 90
