name: Build macOS (AU + VST3)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dsp-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Offline engine test (RT60, stereo, stability)
        run: |
          pip install --quiet numpy scipy
          g++ -O2 -std=c++17 -o tests/render tests/render.cpp
          python3 tests/analyze.py

  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --target MasterVerb_AU MasterVerb_VST3 -- -quiet

      - name: Ad-hoc sign
        run: |
          ART="build/MasterVerb_artefacts/Release"
          codesign --force --deep --sign - "$ART/AU/MASTER VERB.component"
          codesign --force --deep --sign - "$ART/VST3/MASTER VERB.vst3"
          lipo -info "$ART/AU/MASTER VERB.component/Contents/MacOS/MASTER VERB"

      - name: Validate Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/MasterVerb_artefacts/Release/AU/MASTER VERB.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i "Mast" || true
          auval -strict -v aufx MVrb Mast | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log

      - name: Package
        run: |
          ART="build/MasterVerb_artefacts/Release"
          mkdir -p "dist/MASTER VERB"
          cp -R "$ART/AU/MASTER VERB.component" "dist/MASTER VERB/"
          cp -R "$ART/VST3/MASTER VERB.vst3" "dist/MASTER VERB/"
          cp "installer/Install MASTER VERB.command" "dist/MASTER VERB/"
          cp "installer/README.txt" "dist/MASTER VERB/"
          chmod +x "dist/MASTER VERB/Install MASTER VERB.command"
          cp auval.log "dist/MASTER VERB/auval-report.txt"
          cd dist && ditto -c -k --keepParent "MASTER VERB" "MASTER-VERB-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MASTER-VERB-macOS
          path: dist/MASTER-VERB-macOS.zip
          retention-days: 90
